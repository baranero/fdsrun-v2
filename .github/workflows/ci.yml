name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  issues: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/portal
  STAGING_DOMAIN: staging.fdsrun.com

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: fdsrun, POSTGRES_USER: fdsrun, POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fdsrun" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: portal/requirements.txt }
      - run: pip install -r portal/requirements.txt
      - name: Analyzer self-check
        run: node analyzer/cli.js portal/apps/jobs/fixtures/minimal.fds | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ok'], d; print('cells', d['model']['totalCells'])"
      - name: Django checks and tests
        working-directory: portal
        env:
          DATABASE_URL: postgres://fdsrun:test@localhost:5432/fdsrun
          DJANGO_SECRET_KEY: ci
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run
          python manage.py test -v1

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${IMAGE}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: portal/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Find the staging server
        id: server
        env: { HCLOUD_TOKEN: "${{ secrets.HCLOUD_TOKEN }}" }
        run: |
          ip=$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/servers?name=fdsrun-staging" | python3 -c "import json,sys; s=json.load(sys.stdin)['servers']; print(s[0]['public_net']['ipv4']['ip'] if s else '')")
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          if [ -z "$ip" ]; then echo "::notice::No staging server yet — run the Provision workflow first."; fi
          # use the real domain only once DNS points at this server
          dns=$(getent ahostsv4 "$STAGING_DOMAIN" | awk '{print $1; exit}' || true)
          if [ -n "$ip" ] && [ "$dns" = "$ip" ]; then echo "domain=$STAGING_DOMAIN" >> "$GITHUB_OUTPUT"; echo "DNS ok: $STAGING_DOMAIN -> $ip"; else echo "domain=" >> "$GITHUB_OUTPUT"; echo "DNS for $STAGING_DOMAIN resolves to '$dns', server is '$ip' — using sslip.io"; fi
      - name: Push the update to the deployer
        if: steps.server.outputs.ip != ''
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          SERVER_IP: ${{ steps.server.outputs.ip }}
          PORTAL_DOMAIN: ${{ steps.server.outputs.domain }}
        run: python3 deploy/push-update.py
      - name: Record the address in the "Adresy środowisk" issue
        if: steps.server.outputs.ip != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IP: ${{ steps.server.outputs.ip }}
          DOMAIN: ${{ steps.server.outputs.domain }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          url="https://${DOMAIN:-$IP.sslip.io}"
          if [ -n "$DOMAIN" ]; then
            for i in $(seq 1 30); do code=$(curl -s -o /dev/null -w "%{http_code}" "$url/healthz" || true); [ "$code" = "200" ] && break; sleep 10; done
            echo "health on $url: HTTP $code"; [ "$code" = "200" ] || url="$url (certyfikat jeszcze w drodze, HTTP $code)"
          fi
          body="**Staging**: $url  (IP $IP, obraz \`$IMAGE_TAG\`, wdrożono $(date -u +%Y-%m-%dT%H:%MZ))"
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=adresy" --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$num" ] || [ "$num" = "null" ]; then
            gh api "repos/$GITHUB_REPOSITORY/labels" -f name=adresy -f color=0e8a16 >/dev/null 2>&1 || true
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="Adresy środowisk" -f body="$body" -f 'labels[]=adresy' >/dev/null
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$num" -f body="$body" >/dev/null
          fi
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
