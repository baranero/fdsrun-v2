name: FDS image

on:
  push:
    branches: [main]
    paths: ["fds-image/**", ".github/workflows/fds-image.yml"]
  workflow_dispatch:
    inputs:
      fds_version:
        description: "FDS version (e.g. 6.10.1)"
        default: "6.10.1"
      smv_version:
        description: "Smokeview version bundled with it"
        default: "6.10.1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FDS_VERSION: ${{ github.event.inputs.fds_version || '6.10.1' }}
      SMV_VERSION: ${{ github.event.inputs.smv_version || '6.10.1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: fds-image
          push: true
          build-args: |
            FDS_VERSION=${{ env.FDS_VERSION }}
            SMV_VERSION=${{ env.SMV_VERSION }}
          tags: ghcr.io/${{ github.repository }}/fds:${{ env.FDS_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (fds prints its version)
        run: docker run --rm ghcr.io/${{ github.repository }}/fds:${{ env.FDS_VERSION }} fds -v 2>&1 | head -5
