name: Smoke test (real FDS run on staging)

on:
  workflow_dispatch:
    inputs:
      server:
        description: "compute server type"
        default: cpx32
      copy_of:
        description: "rerun the input of an existing job (public id), empty = tiny fixture"
        default: ""
      stop_after_s:
        description: "stop the run after this many seconds of computing (0 = run to the end)"
        default: "0"

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Find staging
        id: s
        run: |
          ip=$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/servers?name=fdsrun-staging" | python3 -c "import json,sys; print(json.load(sys.stdin)['servers'][0]['public_net']['ipv4']['ip'])")
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
      - name: Start the smoke job
        id: start
        run: |
          out=$(python3 deploy/deployer-call.py ${{ steps.s.outputs.ip }} /_deploy/manage '{"args":["smoke_test","--server","${{ github.event.inputs.server }}","--copy-of","${{ github.event.inputs.copy_of }}"]}' 2>&1 || true)
          echo "$out"
          echo "$out" > /tmp/start.txt
          job=$(echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['output'].strip().splitlines()[-1] if d['rc']==0 else '')")
          [ -n "$job" ] || { echo "::error::smoke_test failed"; exit 1; }
          echo "job=$job" >> "$GITHUB_OUTPUT"
      - name: Wait for the result (up to 25 min)
        run: |
          : > /tmp/status.txt
          for i in $(seq 1 75); do
            st=$(python3 deploy/deployer-call.py ${{ steps.s.outputs.ip }} /_deploy/manage '{"args":["job_status","${{ steps.start.outputs.job }}"]}' | python3 -c "import json,sys; print(json.load(sys.stdin)['output'])")
            status=$(echo "$st" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            wall=$(echo "$st" | python3 -c "import json,sys; print(int(json.load(sys.stdin)['wall_s']))")
            echo "[$i] status=$status wall=${wall}s"
            if [ "${{ github.event.inputs.stop_after_s }}" != "0" ] && [ "$status" = "running" ] && [ "$wall" -gt "${{ github.event.inputs.stop_after_s }}" ] && [ -z "$stopped" ]; then
              python3 deploy/deployer-call.py ${{ steps.s.outputs.ip }} /_deploy/manage '{"args":["job_stop","${{ steps.start.outputs.job }}"]}'; stopped=1
            fi
            case "$status" in
              done) echo "$st" | tee /tmp/status.txt; exit 0;;
              cancelled) echo "$st" | tee /tmp/status.txt; [ -n "$stopped" ] && exit 0; echo "::error::job ended with $status"; exit 1;;
              failed|stalled) echo "$st" | tee /tmp/status.txt; echo "::error::job ended with $status"; exit 1;;
            esac
            sleep 20
          done
          echo "::error::timeout"; exit 1
      - name: Download check (archive via Caddy, HTTP Range)
        if: success()
        run: |
          sleep 30
          out=$(python3 deploy/deployer-call.py ${{ steps.s.outputs.ip }} /_deploy/manage '{"args":["share_link","${{ steps.start.outputs.job }}"]}')
          link=$(echo "$out" | python3 -c "import json,sys; print(json.load(sys.stdin)['output'].strip().splitlines()[-1])")
          echo "link: ${link%%\?*}"
          code=$(curl -s -o /tmp/part.bin -w "%{http_code}" -r 0-99 "$link")
          echo "range request -> HTTP $code, $(stat -c %s /tmp/part.bin) bytes"
          [ "$code" = "206" ] || { echo "::error::expected 206 from a Range download"; exit 1; }
      - name: Report into the "Adresy środowisk" issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=adresy" --jq '.[0].number')
          { echo "### Smoke test $(date -u +%Y-%m-%dT%H:%MZ) — ${{ job.status }}"; echo '```'; echo "start:"; cat /tmp/start.txt 2>/dev/null | head -c 3000; echo; echo "status:"; cat /tmp/status.txt 2>/dev/null | head -c 6000; echo '```'; } > /tmp/body.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@/tmp/body.md >/dev/null
