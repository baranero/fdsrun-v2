{% extends "base.html" %}
{% block content %}<section class="card" style="max-width:480px"><h1>Nowe hasło</h1>
{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn primary" type="submit">Zapisz hasło</button></form>
{% else %}<p>Link jest nieprawidłowy lub został już użyty. <a href="{% url 'accounts:password_reset' %}">Poproś o nowy</a>.</p>{% endif %}</section>{% endblock %}
