{% extends "base.html" %}
{% block title %}Reset hasła · fdsrun{% endblock %}
{% block content %}
<section class="card" style="max-width:480px"><h1>Nie pamiętasz hasła?</h1>
<p class="muted">Podaj e-mail, a wyślemy link do ustawienia nowego hasła.</p>
<form method="post">{% csrf_token %}<p><label for="id_email">E-mail</label><input type="email" name="email" id="id_email" required autofocus></p><button class="btn primary" type="submit">Wyślij link</button></form></section>
{% endblock %}
